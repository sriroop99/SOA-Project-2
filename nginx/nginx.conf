events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr" "$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Upstream expense cluster for stateless instances
    # Strategy: Round-Robin (default)
    upstream expense_cluster {
        server expense-service-1:5002 max_fails=3 fail_timeout=10s;
        server expense-service-2:5003 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name localhost;

        # Health check for Nginx LB itself
        location /health {
            return 200 '{"status":"HEALTHY","service":"nginx-load-balancer","balancer":"round-robin"}';
            add_header Content-Type application/json;
        }

        # Proxy expenses traffic to upstream load-balanced cluster
        location /api/expenses/ {
            proxy_pass http://expense_cluster/api/expenses/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # API Gateway proxy for other microservices
        location /api/ {
            proxy_pass http://api-gateway:5000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static Frontend Assets
        location / {
            proxy_pass http://frontend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
